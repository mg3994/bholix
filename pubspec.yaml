name: bholix
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0-211.1.beta

dependencies:
  bloc_signals_flutter: ^1.3.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_scene: ^0.24.0
  intl: ^0.20.3
  kaisel: ^1.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build: ^4.0.7
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  drift_dev: ^2.35.1
  kaisel_lint: ^0.5.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
